<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1440px; height: 900px;
    background: radial-gradient(140% 90% at 50% -10%, #faf8f2 0%, #f6f3ec 55%, #ece7db 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace; color: #1a1815;
  }
  .card { text-align: center; }
  .card h1 {
    font-family: "Fraunces", serif; font-weight: 400; font-size: 84px;
    letter-spacing: -0.015em; line-height: 1.02;
  }
  .card h1 em { font-style: italic; font-weight: 300; }
  .card .dot {
    width: 18px; height: 18px; border-radius: 50%; background: #c4342b;
    margin: 34px auto 0;
  }
  .card .sub {
    margin-top: 30px; font-size: 15px; letter-spacing: .22em;
    color: #6b6458; text-transform: lowercase;
  }
  .card.end h1 { font-size: 64px; }
  .card.end .url {
    margin-top: 26px; font-size: 16px; letter-spacing: .16em; color: #1a1815;
    border-bottom: 1px solid #1a1815; display: inline-block; padding-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="card" id="open" style="display:none">
    <h1>every photograph<br/>has a <em>twin</em>.</h1>
    <div class="sub">mellizo · a museum of resemblances</div>
    <div class="dot"></div>
  </div>
  <div class="card end" id="end" style="display:none">
    <h1>find yours.</h1>
    <div class="url">mellizo.vercel.app</div>
    <div class="dot"></div>
  </div>
  <script>
    const which = new URLSearchParams(location.search).get("card") || "open";
    document.getElementById(which).style.display = "block";
  </script>
</body>
</html>
